<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Have a question, suggestion, or feedback? We'd love to hear from you. Fill out the form below, and we'll get back to you as soon as possible.">

    <meta name="author" content="Israel Gustavo Lopez Bahamondes">

    <title>Contact us| River Rush White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="River Rush White Water Rafting logo">

        <nav class="navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About Us</a>
                </li>

                <li>
                    <a href="trips.html">Trips</a>
                </li>

                <li>
                    <a href="contact.html">Contact Us</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-heading">
            <h1>River Rush White Water Rafting</h1>

            <address>
                <p>123 River Road</p>
                <p>Jackson, Wyoming 83001</p>
                <p>(307) 555-1234</p>
                <p>info@riverrushrafting.com</p>
            </address>
        </section>

        <section class="contact-content">
            <iframe src="YOUR_GOOGLE_MAP_EMBED_LINK_HERE" loading="lazy" allowfullscreen=""
              referrerpolicy="no-referrer-when-downgrade"
              title="Map showing the location of River Rush White Water Rafting">
            </iframe>

            <form class="contact-form">
                <div class="form-row">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your name"
                      required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                      required>
                </div>

                <fieldset class="message-purpose">
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-row message-row">
                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here" required></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Johnson, general manager">
                    <figcaption>Sarah Johnson — General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Michael Carter, lead river guide">
                    <figcaption>Michael Carter — Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Emily Davis, reservation specialist">
                    <figcaption>Emily Davis — Reservation Specialist</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 River Rush White Water Rafting | Israel Lopez</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.svg" alt="Facebook icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram icon">
            </a>

            <a href="https://youtube.com">
                <img src="images/youtube-icon.svg" alt="YouTube icon">
            </a>
        </nav>
    </footer>
</body>

</html>
